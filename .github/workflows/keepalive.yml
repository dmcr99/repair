# ปลุกฐานข้อมูล Supabase ทุกวัน เพื่อไม่ให้โปรเจกต์ฟรีถูกพักเมื่อไม่มีคนใช้งาน 7 วัน
# อ่านที่อยู่และคีย์จาก js/config.js โดยอัตโนมัติ ไม่ต้องตั้งค่าเพิ่ม
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 1 * * *"   # ทุกวัน 08:17 น. เวลาไทย
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*['\"]\K[^'\"]+" js/config.js || true)
          KEY=$(grep -oP "SUPABASE_ANON_KEY:\s*['\"]\K[^'\"]+" js/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "ยังไม่ได้ใส่ SUPABASE_URL / SUPABASE_ANON_KEY ใน js/config.js"
            exit 1
          fi
          CODE=$(curl -s -o /tmp/out.txt -w "%{http_code}" "$URL/rest/v1/places?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $CODE"
          cat /tmp/out.txt
          test "$CODE" = "200"

      # GitHub จะหยุดงานตามเวลาเองถ้า repo ไม่มีความเคลื่อนไหว 60 วัน
      # จึงบันทึกไฟล์เล็ก ๆ เดือนละครั้งเพื่อให้งานนี้ทำงานต่อไปเรื่อย ๆ
      - name: Monthly heartbeat commit
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add .github/heartbeat.txt
            git commit -m "chore: heartbeat" || echo "nothing to commit"
            git push
          fi
